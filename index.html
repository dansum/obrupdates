:root{
  --bg:#f6f8fc; --surface:#ffffff; --on:#1f1f1f; --muted:#5f6368;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--on);font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.55}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hdr{max-width:1280px;margin:0 auto;padding:16px 20px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;margin:0;font-weight:500;letter-spacing:-.2px}
.brand .date{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px;padding-bottom:0}
nav button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0}
nav button:hover{background:var(--bg)}
nav button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
main{max-width:1280px;margin:0 auto;padding:22px 20px 80px}
.view{display:none}
.view.active{display:block}
h2.sec{font-size:17px;font-weight:500;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:500;letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi .d{font-size:12px;margin-top:4px}
.up{color:var(--green)}.down{color:var(--red)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.7}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{font-weight:500}
.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.item .m{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.decision{background:var(--red-s);color:var(--red);border:1px solid #f6c8c4}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--on);outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-s)}
.toolbar .count{color:var(--muted);font-size:12.5px;margin-left:auto}
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfd;position:sticky;top:0}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fbfcfe}
ul.mini{margin:0;padding-left:16px}
ul.mini li{margin:1px 0}
.tip{border-bottom:1px dashed var(--muted);cursor:help;position:relative}
.tip .bubble{display:none;position:absolute;left:0;top:calc(100% + 6px);width:260px;background:#202124;color:#fff;padding:9px 11px;border-radius:10px;font-size:12px;font-weight:400;line-height:1.5;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.tip:hover .bubble{display:block}
.cm{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--blue-s);color:var(--blue);font-weight:500;white-space:nowrap}
.cm:hover{text-decoration:none;background:#d7e6fd}
.srcs{display:flex;gap:5px;flex-wrap:wrap}
.note{background:var(--yellow-s);border:1px solid #fde293;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.ok{background:var(--green-s);border:1px solid #b7e1c2;border-radius:12px;padding:10px 14px;font-size:13px}
.bad{background:var(--red-s);border:1px solid #f6c8c4;border-radius:12px;padding:10px 14px;font-size:13px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.empty{color:var(--muted);font-style:italic;padding:18px;text-align:center}
.lead{color:var(--muted);font-size:13.5px;margin:-4px 0 14px}
@media(max-width:600px){.brand h1{font-size:19px}main{padding:16px 14px 60px}.hdr{padding:14px 14px 0}}
</style>
</head>

function mailLink(subject, body){
  const b = "(Тук напиши коментар си)\n\n\nЗа контекст, ето какво беше написал ИИ по тази тема:\n" + body;
  return "mailto:" + MAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(b);
}
function cmCell(subject, body){
  return `<a class="cm" href="${mailLink(subject, body)}">✉ Коментар</a>`;
}
function srcChips(list){
  return `<span class="srcs">` + list.map(s=>{
    const u = SRC[s];
    const c = tagColor(s);
    const inner = `<span class="tag" style="background:var(--${c}-s);color:var(--${c})">${s}</span>`;
    return u ? `<a href="${u}" target="_blank" rel="noopener">${inner}</a>` : inner;
  }).join("") + `</span>`;
}

/* --- графики --- */
function barChart(data, key, color, fmt){
  const W=760,H=240,PL=52,PR=12,PT=14,PB=42;
  const max = Math.max(...data.map(d=>d[key]));
  const iw = W-PL-PR, ih = H-PT-PB;
  const bw = iw/data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<=4;i++){
    const y = PT+ih-ih*i/4;
    s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e3e6eb"/>`;
    s += `<text x="${PL-8}" y="${y+4}" font-size="10" fill="#5f6368" text-anchor="end">${fmt(max*i/4)}</text>`;
  }
  data.forEach((d,i)=>{
    const hgt = ih*d[key]/max;
    const x = PL+i*bw+bw*0.16, w = bw*0.68;
    s += `<rect x="${x.toFixed(1)}" y="${(PT+ih-hgt).toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${color}"><title>${d.m}: ${fmt(d[key])}</title></rect>`;
    const show = data.length<=14 || i%2===0;
    if(show) s += `<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-24}" font-size="9.5" fill="#5f6368" text-anchor="end" transform="rotate(-45 ${(PL+i*bw+bw/2).toFixed(1)} ${H-24})">${d.m}</text>`;
  });
  return s + `</svg>`;
}
function lineChart(data, keys, colors, fmt){
  const W=760,H=250,PL=42,PR=12,PT=14,PB=42;
  const max = Math.max(...data.flatMap(d=>keys.map(k=>d[k])));
  const iw=W-PL-PR, ih=H-PT-PB;
  const X=i=>PL+iw*i/(data.length-1), Y=v=>PT+ih-ih*v/max;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<=4;i++){
    const y=PT+ih-ih*i/4;
    s += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e3e6eb"/>`;
    s += `<text x="${PL-6}" y="${y+4}" font-size="10" fill="#5f6368" text-anchor="end">${fmt(max*i/4)}</text>`;
  }
  keys.forEach((k,ki)=>{
    const pts = data.map((d,i)=>`${X(i).toFixed(1)},${Y(d[k]).toFixed(1)}`).join(" ");
    s += `<polyline points="${pts}" fill="none" stroke="${colors[ki]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    data.forEach((d,i)=>{ s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(d[k]).toFixed(1)}" r="3.2" fill="${colors[ki]}"><title>${d.m}: ${fmt(d[k])}</title></circle>`; });
  });
  data.forEach((d,i)=>{ s += `<text x="${X(i).toFixed(1)}" y="${H-22}" font-size="9.5" fill="#5f6368" text-anchor="end" transform="rotate(-45 ${X(i).toFixed(1)} ${H-22})">${d.m}</text>`; });
  return s + `</svg>`;
}

function fillInternal(){
  const q = (document.getElementById("f-int-q").value||"").toLowerCase();
  const cat = document.getElementById("f-int-cat").value;
  const src = document.getElementById("f-int-src").value;
  const dec = document.getElementById("f-int-dec").value;
  const rows = INTERNAL.filter(r=>{
    if(cat && r.cat!==cat) return false;
    if(src && !r.srcs.includes(src)) return false;
    if(dec && !r.decision) return false;
    if(q && !(r.tema+r.tip+r.owner+r.concl.join(" ")+r.next.join(" ")).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("c-int").textContent = rows.length + " от " + INTERNAL.length + " теми";
  document.getElementById("tb-int").innerHTML = rows.length ? rows.map(r=>{
    const body = `${r.tema} (${r.date})\nОбяснение: ${r.tip}\nСобственик: ${r.owner}\nЗаключения: ${r.concl.join("; ")}\nСледва: ${r.next.join("; ")}\nКатегория: ${r.cat}\nИзточници: ${r.srcs.join(", ")}`;
    return `<tr>
      <td><a href="${r.url}" target="_blank" rel="noopener"><span class="tip">${r.tema}<span class="bubble">${r.tip}</span></span></a>
        ${r.decision?'<div style="margin-top:4px"><span class="tag decision">⚑ решение на ИД</span></div>':''}
        <div style="color:var(--muted);font-size:11.5px;margin-top:3px">${r.date}</div></td>
      <td>${r.owner}</td>
      <td><ul class="mini">${r.concl.map(x=>`<li>${x}</li>`).join("")}</ul></td>
      <td><ul class="mini">${r.next.map(x=>`<li>${x}</li>`).join("")}</ul></td>
      <td>${tagHTML(r.cat)}</td>
      <td>${srcChips(r.srcs)}</td>
      <td>${cmCell("ОбР — " + r.tema, body)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="7" class="empty">Няма съвпадения</td></tr>`;
}

function fillNews(){
  const q=(document.getElementById("f-nw-q").value||"").toLowerCase();
  const src=document.getElementById("f-nw-src").value;
  const tag=document.getElementById("f-nw-tag").value;
  const rows = NEWS.filter(r=>{
    if(src && r.src!==src) return false;
    if(tag && !r.tags.includes(tag)) return false;
    if(q && !(r.t+r.why).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById("c-nw").textContent = rows.length + " от " + NEWS.length + " новини";
  document.getElementById("tb-nw").innerHTML = rows.length ? rows.map(r=>{
    const body = `${r.t}\n${r.url}\nДата: ${r.date} · Източник: ${r.src}\nЗащо е важно: ${r.why}`;

      <td><a href="${r.url}" target="_blank" rel="noopener">${r.t}</a></td>
      <td style="white-space:nowrap">${r.date}</td>

      <td>${r.tags.map(tagHTML).join(" ")}</td>

}

function fillMentions(){
  const q=(document.getElementById("f-mn-q").value||"").toLowerCase();

  }).join("") : `<tr><td colspan="4" class="empty">Няма съвпадения</td></tr>`;
}

  h += `<div class="tblwrap"><table><thead><tr><th style="min-width:230px">Източник</th><th>Резултат</th><th style="min-width:420px">Бележки, затруднения и допускания</th><th>Коментар</th></tr></thead><tbody>`;
  TECH_SOURCES.forEach(r=>{
    const [c,lbl] = badge[r.status];
    h += `<tr><td><b>${r.src}</b></td>
      <td><span class="tag" style="background:var(--${c}-s);color:var(--${c})">${lbl}</span></td>
      <td>${r.note}</td>
      <td>${cmCell("Технически — " + r.src, r.src + "\n" + lbl + "\n" + r.note)}</td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<div class="ok" style="margin-top:14px"><b>Проверка:</b> пощенската кутия на потребителя не е отваряна и нищо в доклада не произхожда от нея. Темите са де-дублирани между източниците: ПИЗА, работата с училища, съдържанието и ИИ се появяват веднъж, с линкове към всички източници, в които са повдигнати.</div>`;
  return h;

/* ============ РУТЕР ============ */
const nav = document.getElementById("nav"), main = document.getElementById("main");
VIEWS.forEach((v,i)=>{
  const b=document.createElement("button"); b.textContent=v.name; b.dataset.id=v.id;
  b.onclick=()=>go(v.id); nav.appendChild(b);
  const d=document.createElement("div"); d.className="view"; d.id="v-"+v.id; main.appendChild(d);
});
function go(id){
  VIEWS.forEach(v=>{
    document.getElementById("v-"+v.id).classList.toggle("active", v.id===id);
  });
  [...nav.children].forEach(b=>b.classList.toggle("active", b.dataset.id===id));
  window.scrollTo({top:0,behavior:"smooth"});
}
VIEWS.forEach(v=>{ document.getElementById("v-"+v.id).innerHTML = v.render(); });

/* слушатели за филтрите */
["f-int-q","f-int-cat","f-int-src","f-int-dec"].forEach(id=>{
  const e=document.getElementById(id); e.addEventListener("input",fillInternal); e.addEventListener("change",fillInternal);
});
["f-nw-q","f-nw-src","f-nw-tag"].forEach(id=>{
  const e=document.getElementById(id); e.addEventListener("input",fillNews); e.addEventListener("change",fillNews);
});
["f-mn-q","f-mn-src"].forEach(id=>{
  const e=document.getElementById(id); e.addEventListener("input",fillMentions); e.addEventListener("change",fillMentions);
});
fillInternal(); fillNews(); fillMentions();

document.addEventListener("click",e=>{

});
go("overview");
