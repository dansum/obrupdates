<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Защитен документ</title>
<style>
:root{--bg:#f6f8fc;--surface:#fff;--on:#1f1f1f;--muted:#5f6368;--line:#e3e6eb;--blue:#1a73e8;--blue-s:#e8f0fe;--red:#d93025;--red-s:#fce8e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--on);font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px 1px rgba(60,64,67,.15);padding:30px 28px;width:min(380px,92vw);text-align:center}
.lock{font-size:34px;line-height:1}
h1{font-size:18px;font-weight:500;margin:12px 0 4px}
p{color:var(--muted);margin:0 0 18px;font-size:13px}
input{font:inherit;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;width:100%;outline:none;text-align:center}
input:focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-s)}
button{font:inherit;font-size:14.5px;font-weight:500;padding:11px 0;border:none;border-radius:999px;background:var(--blue);color:#fff;cursor:pointer;width:100%;margin-top:10px}
button:hover{background:#1765cc}
button:disabled{background:#dadce0;color:#9aa0a6;cursor:not-allowed}
.err{display:none;margin-top:12px;background:var(--red-s);color:var(--red);border:1px solid #f6c8c4;border-radius:10px;padding:9px 12px;font-size:12.5px}
.err.show{display:block}
</style>
</head>
<body>
<div class="box">
  <div class="lock">&#128274;</div>
  <h1>Защитен документ</h1>
  <p>Въведете паролата, за да отворите съдържанието.</p>
  <form id="f" autocomplete="off">
    <input type="password" id="p" placeholder="Парола" autofocus>
    <button type="submit" id="b">Отключи</button>
  </form>
  <div class="err" id="e"></div>
</div>

<script>
const D = JSON.parse(document.getElementById("d").textContent);
const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById("f"), p = document.getElementById("p"),
      b = document.getElementById("b"), e = document.getElementById("e");
f.onsubmit = async ev => {
  ev.preventDefault();
  e.className = "err"; b.disabled = true; b.textContent = "Отключване…";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(p.value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:un(D.salt), iterations:D.it, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:un(D.iv)}, key, un(D.ct));
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }catch(err){
    e.textContent = "Грешна парола."; e.className = "err show";
    b.disabled = false; b.textContent = "Отключи";
    p.value = ""; p.focus();
  }
};
</script>
