(function(){
  var D = JSON.parse(document.getElementById('payload').textContent);
  var card = document.getElementById('card'), f = document.getElementById('f'),
      pw = document.getElementById('pw'), go = document.getElementById('go'),
      msg = document.getElementById('msg');

  function b64(s){ var b = atob(s), a = new Uint8Array(b.length);
    for (var i=0;i<b.length;i++) a[i] = b.charCodeAt(i); return a; }

  async function inflate(bytes){
    if (D.comp !== 'deflate-raw') return bytes;
    var ds = new DecompressionStream('deflate-raw');
    var out = new Response(new Blob([bytes]).stream().pipeThrough(ds));
    return new Uint8Array(await out.arrayBuffer());
  }

  async function open_(pass){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(D.kdf.salt), iterations:D.kdf.iter, hash:D.kdf.hash },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(D.iv) }, key, b64(D.ct));
    var html = new TextDecoder('utf-8').decode(await inflate(new Uint8Array(plain)));
    document.open(); document.write(html); document.close();
  }

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; msg.className = 'msg busy'; msg.textContent = 'Разшифроване…';
    await new Promise(function(r){ setTimeout(r, 30); });
    try {
      await open_(pw.value);
    } catch (err) {
      msg.className = 'msg';
      msg.textContent = (window.crypto && crypto.subtle)
        ? 'Грешна парола. Опитайте отново.'
        : 'Браузърът не поддържа разшифроване. Отворете файла локално или с друг браузър.';
      go.disabled = false; pw.select();
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  });
})();
</script>
</body>
</html>
