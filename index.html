*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{

a{color:var(--blue); text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- Header ---------- */
header{
  background:#fff; border-bottom:1px solid var(--grey-200);
  padding:22px 28px 0; position:sticky; top:0; z-index:50;
  box-shadow:0 1px 2px rgba(60,64,67,.12);
}
.h-top{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; max-width:1500px; margin:0 auto}
h1{font-size:26px; font-weight:500; margin:0; letter-spacing:-.3px}
h1 .dot{color:var(--blue)}
.h-sub{color:var(--grey-700); font-size:13px}
.h-badge{
  margin-left:auto; background:linear-gradient(135deg,#1a73e8,#9334e6); color:#fff;
  padding:5px 14px; border-radius:999px; font-size:12px; font-weight:500; letter-spacing:.2px;
}
/* Tabs */
nav{display:flex; gap:2px; overflow-x:auto; max-width:1500px; margin:14px auto 0; scrollbar-width:thin}
nav button{
  background:none; border:none; border-bottom:3px solid transparent; cursor:pointer;
  font:inherit; font-size:13.5px; font-weight:500; color:var(--grey-700);
  padding:12px 16px; white-space:nowrap; border-radius:8px 8px 0 0; transition:.15s;
}
nav button:hover{background:var(--grey-100); color:var(--grey-900)}
nav button.on{color:var(--blue); border-bottom-color:var(--blue); background:#e8f0fe}

/* ---------- Layout ---------- */
main{max-width:1500px; margin:0 auto; padding:24px 28px 80px}
section{display:none; animation:fade .22s ease}
section.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:21px; font-weight:500; margin:0 0 4px}
.lede{color:var(--grey-700); margin:0 0 20px; font-size:13.5px}
h3{font-size:15px; font-weight:500; margin:28px 0 12px; display:flex; align-items:center; gap:9px}
h3 .num{
  width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;
}

/* ---------- Cards ---------- */
.card{background:#fff; border:1px solid var(--grey-200); border-radius:var(--r); box-shadow:var(--shadow-1)}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}

.kpi{padding:16px 18px; border-radius:var(--r); background:#fff; border:1px solid var(--grey-200); box-shadow:var(--shadow-1)}
.kpi .v{font-size:28px; font-weight:500; line-height:1.15; letter-spacing:-.5px}
.kpi .l{font-size:12px; color:var(--grey-700); margin-top:3px}
.kpi .d{font-size:11.5px; margin-top:6px; font-weight:500}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--grey-600)}

.topic{
  padding:15px 17px; border-left:4px solid var(--blue); border-radius:10px; background:#fff;
  border-top:1px solid var(--grey-200); border-right:1px solid var(--grey-200); border-bottom:1px solid var(--grey-200);
  box-shadow:var(--shadow-1); transition:.16s;
}
.topic:hover{box-shadow:var(--shadow-2); transform:translateY(-1px)}
.topic .t{font-weight:500; font-size:15px; margin-bottom:6px; display:flex; gap:8px; align-items:flex-start}
.topic .b{color:var(--grey-700); font-size:13px}
.topic .meta{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}

/* ---------- Chips / tags ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:2.5px 10px; border-radius:999px;
  font-size:11.5px; font-weight:500; line-height:1.6; white-space:nowrap;
}
.chip.link:hover{filter:brightness(.94); text-decoration:none}
.src{
  display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:6px;
  font-size:11px;font-weight:500;border:1px solid transparent;white-space:nowrap;
}
.decision{

  padding:2.5px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap;
}
.owner{

  padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:500;
}

.filters{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 14px;
  background:#fff; border:1px solid var(--grey-200); border-radius:var(--r); padding:12px 14px; box-shadow:var(--shadow-1);
}
.filters input[type=search]{
  font:inherit; font-size:13px; padding:8px 13px; border:1px solid var(--grey-300);
  border-radius:999px; min-width:250px; flex:1 1 250px; outline:none; background:var(--grey-50);
}
.filters input[type=search]:focus{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px #e8f0fe}
.fgroup{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.flabel{font-size:11.5px; color:var(--grey-700); font-weight:500; margin-right:2px}
.fbtn{
  font:inherit; font-size:11.5px; font-weight:500; cursor:pointer; padding:4px 11px;
  border-radius:999px; border:1px solid var(--grey-300); background:#fff; color:var(--grey-700); transition:.13s;

.fbtn:hover{background:var(--grey-100)}
.fbtn.on{background:#e8f0fe; border-color:#aecbfa; color:var(--blue-d)}
.count{font-size:12px; color:var(--grey-600); margin-left:auto; white-space:nowrap}

.twrap{background:#fff; border:1px solid var(--grey-200); border-radius:var(--r); box-shadow:var(--shadow-1); overflow:visible}
@media(max-width:1150px){.twrap{overflow-x:auto}}
table{border-collapse:collapse; width:100%; font-size:13px}
thead th{
  background:var(--grey-50); text-align:left; font-weight:500; font-size:11.5px;
  color:var(--grey-700); text-transform:uppercase; letter-spacing:.5px;
  padding:11px 14px; border-bottom:1px solid var(--grey-200); white-space:nowrap;

thead th:first-child{border-top-left-radius:var(--r)}
thead th:last-child{border-top-right-radius:var(--r)}
tbody td{padding:12px 14px; border-bottom:1px solid var(--grey-100); vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fbff}
td ul{margin:0; padding-left:16px}
td ul li{margin-bottom:3px}
td ul li:last-child{margin-bottom:0}
.tname{font-weight:500}
.tname a{color:var(--grey-900); border-bottom:1.5px dotted var(--blue)}
.tname a:hover{color:var(--blue); text-decoration:none}
.empty{padding:40px; text-align:center; color:var(--grey-600); font-size:13px}

/* Tooltip */
.tip{position:relative; cursor:help}
.tip .bubble{
  visibility:hidden; opacity:0; position:absolute; z-index:100; left:0; top:calc(100% + 7px);
  width:290px; background:#202124; color:#fff; padding:9px 12px; border-radius:8px;
  font-size:12px; font-weight:400; line-height:1.5; box-shadow:var(--shadow-2); transition:.14s;
  text-transform:none; letter-spacing:0;
}
.tip:hover .bubble{visibility:visible; opacity:1}

  background:#e8f0fe; color:var(--blue-d); font-size:11.5px; font-weight:500; white-space:nowrap;

.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

  border:2px dashed var(--grey-300); border-radius:var(--r); background:var(--grey-50);

.ph b{display:block; color:var(--grey-700); font-weight:500; font-size:14px; margin-bottom:4px}

.note.ok{background:#e6f4ea; border-color:#ceead6; border-left-color:var(--green)}

ul.plain li{margin-bottom:5px}
.foot{text-align:center; color:var(--grey-600); font-size:12px; padding:28px 0 0}
.status-ok{color:var(--green);font-weight:500}
.status-part{color:var(--orange);font-weight:500}
.status-bad{color:var(--red);font-weight:500}
@media(max-width:700px){

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAL = ["#1a73e8","#9334e6","#e8710a","#188038","#d01884","#00897b","#3f51b5","#c5221f","#8a6100","#455a64"];
function hashHue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PAL[h%PAL.length];}
function tag(t){
  const st = TAG_STYLE[t];
  if(st) return `<span class="chip" style="background:${st.bg};color:${st.fg}">${esc(t)}</span>`;
  const c = hashHue(t);
  return `<span class="chip" style="background:${c}1a;color:${c}">${esc(t)}</span>`;
}
function tags(a){return (a||[]).map(tag).join(" ");}
function srcChip(n,u){
  const st = SRC_STYLE[n] || {bg:"#f1f3f4",fg:"#5f6368",bd:"#dadce0"};
  const s = `background:${st.bg};color:${st.fg};border-color:${st.bd}`;
  return u ? `<a class="src" style="${s}" href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`
           : `<span class="src" style="${s}">${esc(n)}</span>`;
}
function srcs(a){return (a||[]).map(s=>srcChip(s.n,s.u)).join(" ");}
function owner(o){return `<span class="owner">${esc(o)}</span>`;}
function ul(a){return `<ul>${(a||[]).map(x=>`<li>${x}</li>`).join("")}</ul>`;}

/* Универсална филтрируема таблица */
function buildTable(host, {cols, rows, facets}){
  const id = "t"+Math.random().toString(36).slice(2,8);
  const state = {q:"", f:{}};
  (facets||[]).forEach(f=>state.f[f.key]=new Set());

  let fh = `<div class="filters">
    <input type="search" id="${id}q" placeholder="Търсене…" aria-label="Търсене">`;
  (facets||[]).forEach(f=>{
    fh += `<div class="fgroup"><span class="flabel">${esc(f.label)}:</span>`
       + f.values.map(v=>`<button class="fbtn" data-fk="${esc(f.key)}" data-fv="${esc(v)}">${esc(v)}</button>`).join("")
       + `</div>`;
  });
  fh += `<span class="count" id="${id}c"></span></div>`;

  host.insertAdjacentHTML("beforeend", fh);
  host.insertAdjacentHTML("beforeend",
    `<div class="twrap"><table><thead><tr>${cols.map(c=>`<th${c.w?` style="width:${c.w}"`:""}>${esc(c.h)}</th>`).join("")}</tr></thead><tbody id="${id}b"></tbody></table></div>`);

  const body = document.getElementById(id+"b");
  const cnt  = document.getElementById(id+"c");

  function match(r){
    if(state.q){
      const hay = JSON.stringify(r).toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;
    }
    for(const f of (facets||[])){
      const sel = state.f[f.key];
      if(sel.size===0) continue;
      const vals = f.get(r);
      if(!vals.some(v=>sel.has(v))) return false;
    }
    return true;
  }
  function render(){
    const vis = rows.filter(match);
    body.innerHTML = vis.length
      ? vis.map(r=>`<tr>${cols.map(c=>`<td>${c.f(r)}</td>`).join("")}</tr>`).join("")
      : `<tr><td colspan="${cols.length}"><div class="empty">Няма съвпадения. Изчистете филтрите.</div></td></tr>`;
    cnt.textContent = `${vis.length} от ${rows.length}`;
  }
  document.getElementById(id+"q").addEventListener("input", e=>{state.q=e.target.value; render();});
  host.querySelectorAll(`.fbtn`).forEach(b=>{
    if(!b.dataset.fk) return;
    b.addEventListener("click", ()=>{
      const s = state.f[b.dataset.fk];
      s.has(b.dataset.fv) ? s.delete(b.dataset.fv) : s.add(b.dataset.fv);
      b.classList.toggle("on");
      render();
    });
  });
  render();
}

(function(){
  const h = document.getElementById("v-danni");

  /* хоризонтална лентова графика */
  function hbar(data, opts){
    const rowH = 22, pad = {l:210, r:44, t:6, b:22}, max = opts.max || Math.max(...data.map(d=>d[1]));
    const W = 1000, H = pad.t + data.length*rowH + pad.b, iw = W - pad.l - pad.r;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    for(let g=0; g<=4; g++){
      const x = pad.l + iw*g/4;
      s += `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${H-pad.b}" stroke="#e8eaed"/>`;
      s += `<text x="${x}" y="${H-pad.b+15}" font-size="11" fill="#80868b" text-anchor="middle">${Math.round(max*g/4)}${opts.unit||""}</text>`;
    }
    data.forEach((d,i)=>{
      const y = pad.t + i*rowH + 3, w = Math.max(1.5, iw*d[1]/max);
      s += `<text x="${pad.l-9}" y="${y+11}" font-size="11" fill="#3c4043" text-anchor="end">${esc(d[0].length>30?d[0].slice(0,29)+"…":d[0])}</text>`;
      s += `<rect x="${pad.l}" y="${y}" width="${w}" height="${rowH-8}" rx="3" fill="${opts.color}"><title>${esc(d[0])}: ${d[1]}${opts.unit||""}</title></rect>`;
      s += `<text x="${pad.l+w+6}" y="${y+11}" font-size="11" font-weight="500" fill="#5f6368">${d[1]}${opts.unit||""}</text>`;
    });
    return s + `</svg>`;
  }

  /* подредена лентова графика по време */
  function stacked(data, opts){
    const pad={l:58,r:14,t:10,b:40}, W=1000, H=340, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
    const max = Math.max(...data.map(d=>d[1]+d[2])), bw = iw/data.length;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
    for(let g=0; g<=4; g++){
      const y = pad.t + ih - ih*g/4, v = Math.round(max*g/4);
      s += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#e8eaed"/>`;
      s += `<text x="${pad.l-8}" y="${y+4}" font-size="11" fill="#80868b" text-anchor="end">${v.toLocaleString("bg-BG")}</text>`;
    }
    data.forEach((d,i)=>{
      const x = pad.l + i*bw + bw*0.16, w = bw*0.68;
      const h1 = ih*d[1]/max, h2 = ih*d[2]/max;
      s += `<rect x="${x}" y="${pad.t+ih-h1-h2}" width="${w}" height="${h2}" fill="${opts.c2}" rx="2"><title>${esc(d[0])} · менторирани: ${d[2].toLocaleString("bg-BG")}</title></rect>`;
      s += `<rect x="${x}" y="${pad.t+ih-h1}" width="${w}" height="${h1}" fill="${opts.c1}" rx="2"><title>${esc(d[0])} · други: ${d[1].toLocaleString("bg-BG")} · общо: ${(d[1]+d[2]).toLocaleString("bg-BG")}</title></rect>`;
      if(i%3===0 || i===data.length-1)
        s += `<text x="${x+w/2}" y="${H-pad.b+16}" font-size="10.5" fill="#80868b" text-anchor="middle" transform="rotate(-32 ${x+w/2} ${H-pad.b+16})">${esc(d[0])}</text>`;

/* =====================================================================

const VIEWS = [
  ["v-obshta","Обща"],["v-us","Отчет за УС"],["v-chlenove","Отчет за членове"],
  ["v-danni","Данни"],["v-vatreshni","Вътрешни развития"],["v-novini","Новини"],
  ["v-spomenavania","@Споменавания"],["v-tehnicheski","Технически"]
];
const nav = document.getElementById("nav");
nav.innerHTML = VIEWS.map(([id,l],i)=>`<button data-v="${id}"${i===0?' class="on"':''}>${l}</button>`).join("");
function go(id){
  VIEWS.forEach(([v])=>document.getElementById(v).classList.toggle("on", v===id));
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===id));
  window.scrollTo({top:0, behavior:"smooth"});
}
nav.addEventListener("click", e=>{ if(e.target.dataset.v) go(e.target.dataset.v); });
document.addEventListener("click", e=>{
  const a = e.target.closest("[data-goto]");
  if(a){ e.preventDefault(); go(a.dataset.goto); }
});
</script>
